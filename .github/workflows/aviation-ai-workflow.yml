name: Aviation AI Workflow

on:
  push:
    paths:
      - "aviation-ai-workflow/**"
      - ".github/workflows/aviation-ai-workflow.yml"
  pull_request:
    paths:
      - "aviation-ai-workflow/**"
      - ".github/workflows/aviation-ai-workflow.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install workflow dependencies
        working-directory: aviation-ai-workflow
        run: python -m pip install -r requirements.txt

      - name: Run Python tests
        working-directory: aviation-ai-workflow
        run: python -m pytest -q

      - name: Validate Python syntax
        working-directory: aviation-ai-workflow
        run: python -m py_compile src/review_submission.py src/server.py

      - name: Validate browser JavaScript syntax
        working-directory: aviation-ai-workflow
        run: |
          node --check web/app.js
          node --check web/report.js
