<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc"><title id="title">ZIPSmart dashboard illustration</title><desc id="desc">Synthetic sample data, summary cards and a ZIP metrics table. Actual interactive dashboard is generated by the Python pipeline.</desc><rect width="1120" height="640" fill="#f1f5f8"/><rect width="1120" height="150" fill="#102e43"/><g font-family="Arial,sans-serif"><text x="40" y="35" fill="#b9d6e9" font-size="13">JAMES JENNINGS · PORTFOLIO DEMONSTRATION</text><text x="40" y="83" fill="white" font-size="36" font-weight="bold">ZIPSmart Data Explorer</text><text x="40" y="119" fill="#d2e2ef" font-size="16">Python · SQLite · Data quality · Local API</text><rect x="40" y="170" width="1040" height="45" rx="5" fill="#fff0c7"/><text x="56" y="199" fill="#5d4300" font-size="15">SYNTHETIC DATA ONLY — invented figures for a reproducible portfolio demonstration.</text><rect x="40" y="235" width="330" height="100" rx="10" fill="white" stroke="#d7e2ea"/><text x="60" y="265" font-size="14" fill="#526777">Sample ZIP records</text><text x="60" y="312" font-size="32" font-weight="bold" fill="#102e43">12</text><rect x="395" y="235" width="330" height="100" rx="10" fill="white" stroke="#d7e2ea"/><text x="415" y="265" font-size="14" fill="#526777">Synthetic population</text><text x="415" y="312" font-size="32" font-weight="bold" fill="#102e43">166,300</text><rect x="750" y="235" width="330" height="100" rx="10" fill="white" stroke="#d7e2ea"/><text x="770" y="265" font-size="14" fill="#526777">Illustrative data year</text><text x="770" y="312" font-size="32" font-weight="bold" fill="#102e43">2025</text><rect x="40" y="355" width="1040" height="235" rx="10" fill="white" stroke="#d7e2ea"/><text x="60" y="387" fill="#102e43" font-size="20" font-weight="bold">Explore the sample</text><text x="60" y="419" fill="#526777" font-size="12">ZIP</text><text x="210" y="419" fill="#526777" font-size="12">STATE</text><text x="365" y="419" fill="#526777" font-size="12">POPULATION</text><text x="565" y="419" fill="#526777" font-size="12">HOUSEHOLDS</text><text x="795" y="419" fill="#526777" font-size="12">MEDIAN INCOME</text><text x="60" y="453" fill="#102e43" font-size="17">50309</text><text x="210" y="453" fill="#102e43" font-size="17">IA</text><text x="365" y="453" fill="#102e43" font-size="17">9,500</text><text x="565" y="453" fill="#102e43" font-size="17">4,900</text><text x="795" y="453" fill="#102e43" font-size="17">$72,000</text><text x="60" y="497" fill="#102e43" font-size="17">52501</text><text x="210" y="497" fill="#102e43" font-size="17">IA</text><text x="365" y="497" fill="#102e43" font-size="17">24,000</text><text x="565" y="497" fill="#102e43" font-size="17">9,800</text><text x="795" y="497" fill="#102e43" font-size="17">$51,000</text><text x="60" y="541" fill="#102e43" font-size="17">52554</text><text x="210" y="541" fill="#102e43" font-size="17">IA</text><text x="365" y="541" fill="#102e43" font-size="17">2,200</text><text x="565" y="541" fill="#102e43" font-size="17">920</text><text x="795" y="541" fill="#102e43" font-size="17">$57,000</text><text x="40" y="623" fill="#526777" font-size="13">Illustration of the demo · sample rows shown: Iowa · not real geographic observations</text></g></svg>