name: AvionicsVoiceOps

options:
  bundleIdPrefix: com.jamesjennings
  deploymentTarget:
    iOS: "17.0"

targets:
  AvionicsVoiceOps:
    type: application
    platform: iOS
    sources:
      - App
      - Models
      - Services
      - Voice
      - Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jamesjennings.AvionicsVoiceOps
        SWIFT_VERSION: 5.10
    info:
      path: App/Info.plist

  AvionicsVoiceOpsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: AvionicsVoiceOps
    settings:
      base:
        SWIFT_VERSION: 5.10
